[package]
name = "tachikaze"
version = "0.1.0"
edition = "2021"
license = "MIT"
# cargo-about の [private] ignore で本体を THIRD-PARTY-LICENSES.md から外すため。crates.io に公開するときは別の除外方法が要る。
publish = false
description = "Lossless CM cutting for already-converted mp4 recordings (no re-encode)"
repository = "https://github.com/fetburner/Tachikaze"
readme = "README.md"
keywords = ["mp4", "video", "cm-cut", "lossless"]
categories = ["command-line-utilities", "multimedia"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive"] }
mp4-atom = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
