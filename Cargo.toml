[package]
name = "tachikaze"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Lossless CM cutting for already-converted mp4 recordings (no re-encode)"
repository = "https://github.com/fetburner/Tachikaze"
readme = "README.md"
keywords = ["mp4", "video", "cm-cut", "lossless"]
categories = ["command-line-utilities", "multimedia"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive"] }
mp4-atom = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
