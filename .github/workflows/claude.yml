name: Claude Code

# @claude メンションでの試験導入（読み取り専用）。
# パブリックリポジトリ向けの安全側設定:
#   - allowed_non_write_users / allowed_bots は設定しない（write 権限保持者のみ起動可）
#   - ジョブスコープの GITHUB_TOKEN を使い、contents: read を強制する
#   - ファイル変更と Bash を拒否し、調査と回答のみにする
#   - show_full_output は既定 false のまま（ログにシークレットを出さない）
#   - if: で author_association を確認し、ジョブ起動前に外部ユーザーを弾く（多層防御）

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Action 内部の write 権限チェックに加え、ジョブ起動前に投稿者を絞る。
    # 外部コントリビュータは CONTRIBUTOR / NONE になり、ここで弾かれる。
    if: |
      (github.event_name == 'issue_comment' &&
       contains(github.event.comment.body, '@claude') &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR')) ||
      (github.event_name == 'pull_request_review_comment' &&
       contains(github.event.comment.body, '@claude') &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR')) ||
      (github.event_name == 'pull_request_review' &&
       contains(github.event.review.body, '@claude') &&
       (github.event.review.author_association == 'OWNER' ||
        github.event.review.author_association == 'MEMBER' ||
        github.event.review.author_association == 'COLLABORATOR'))
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read       # ジョブスコープの GITHUB_TOKEN で push を禁止
      pull-requests: write # PR への応答コメント
      issues: write        # Issue への応答コメント
      actions: read        # PR の CI 結果を参照

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: https://api.sakana.ai
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # 既定の Claude GitHub App トークンは Contents: write を持つため使わない。
          # permissions で制限された短命のワークフロートークンを明示的に渡す。
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --max-turns 20
            --disallowedTools "Bash,Edit,Write,NotebookEdit,NotebookEditCell,Replace"
