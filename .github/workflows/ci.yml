name: CI

on:
  push:
    branches: [master]
  pull_request:

# 本 CI は fmt / clippy / 単体テストのみで
# 外部3ツールや ffmpeg も要らないため、1 vCPU の ubuntu-slim で足りる。
# 制約: ジョブ上限 15 分・特権操作不可（Docker-in-Docker 等）。
# コールドビルドが 15 分に近づくようなら ubuntu-latest に戻す。
jobs:
  # 日本語ドキュメントの文面検査（ルールは .textlintrc.json）。
  # no-doubled-joshi / ja-no-mixed-period 等は技術文書では誤検知が多いため無効化し、
  # 文長(120字)・読点数など読みやすさに直結する規則だけを効かせている。
  docs-lint:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: textlint
        run: >
          npx --yes
          --package textlint
          --package textlint-rule-preset-ja-technical-writing
          -- textlint README.md 'docs/*.md'

  test:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test
