name: CI

on:
  push:
    branches: [master]
  pull_request:

# 本 CI は actionlint（ワークフロー検査）、docs-lint（textlint）、test（fmt / clippy / 単体テスト）、e2e、e2e-tools の5ジョブ。
# actionlint は Docker コンテナ action を使うため ubuntu-latest で動かす。
# docs-lint と test は ubuntu-slim で動かす。ジョブ上限は 15 分で、特権操作（Docker-in-Docker 等）はできない。
# コールドビルドが 15 分に近づくようなら ubuntu-latest に戻す。
# test は TACHIKAZE_REQUIRE_TEST_PREREQS を設定せず、外部ツールもフィクスチャもない環境で通ることを検査する。
# TACHIKAZE_REQUIRE_TEST_PREREQS は e2e と e2e-tools で設定する。
# ubuntu-slim は container ジョブに使えないため、e2e と e2e-tools は ubuntu-24.04 と ubuntu-24.04-arm で動かす。
# 主な実行環境は Linux で、arm64 は事前検証済みだが x86_64 は未検証のため、両方で実行する。
# e2e と e2e-tools は rust:1-trixie を使い、runtime と同じ Debian 13 の ffmpeg を apt で入れる。
# Debian 13 は stable のため、ffmpeg のマイナー版は変わらない。
# e2e は apt のネットワーク取得に起因する一時的な失敗を減らすため、パッケージ一覧と .deb をキャッシュする。
# キャッシュが当たったら、まずネットワークに接続せず ffmpeg の導入を試す。
# フィクスチャはコミットせず毎回生成する。ffmpeg の導入と生成には合わせて約1分かかる。
# 実ツールを使うテストは、上流起因の失敗と本体のデグレを見分けるため、e2e では --skip で除外し、
# e2e-tools では --skip なしで回す。3ツールは scripts/build-external-tools.sh で SHA 固定ビルドする。
jobs:
  # actionlint の実行と PR への行コメントに reviewdog/action-actionlint を使う。
  # 上流 rhysd/actionlint 1.7.12 と ShellCheck 0.11.0 を同梱し、GHCR イメージを digest で固定した v1.74.0 を SHA で参照する。
  # v1.75.0 以降は個人のフォーク kjanat/actionlint から 1.17.x を取得するため、更新しない。
  actionlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: reviewdog/action-actionlint@ae857e78c1b42b3d0a49637181b09d3d56d402b4  # v1.84.1
        with:
          # github-pr-review は PR がないと指摘を処理せずに成功で終わるため、push では Actions の注釈を使う。
          reporter: ${{ github.event_name == 'pull_request' && 'github-pr-review' || 'github-annotations' }}
          # SC2086 など info の指摘でもジョブを失敗させる。
          fail_level: any
          filter_mode: nofilter

  # 日本語ドキュメントの文面検査（ルールは .textlintrc.json、版は package-lock.json で固定）。
  # no-doubled-joshi / ja-no-mixed-period 等は技術文書では誤検知が多いため無効化し、
  # 文長(120字)・読点数など読みやすさに直結する規則だけを効かせている。
  docs-lint:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: textlint
        run: npm run docs-lint

  test:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

  e2e:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    container: rust:1-trixie
    env:
      TACHIKAZE_REQUIRE_TEST_PREREQS: "1"
    steps:
      - uses: actions/checkout@v7

      - name: apt cache for ffmpeg
        id: apt-cache
        uses: actions/cache@v6
        with:
          path: |
            /var/cache/apt/archives
            /var/lib/apt/lists
          key: ${{ runner.os }}-${{ runner.arch }}-apt-ffmpeg-v1

      - name: ffmpeg
        env:
          APT_CACHE_HIT: ${{ steps.apt-cache.outputs.cache-hit }}
          DEBIAN_FRONTEND: noninteractive
        run: |
          rm -f /etc/apt/apt.conf.d/docker-clean
          printf '%s\n' 'APT::Keep-Downloaded-Packages "true";' > /etc/apt/apt.conf.d/keep-downloaded-packages
          if [ "$APT_CACHE_HIT" != "true" ] || ! apt-get install -y -qq --no-install-recommends --no-download ffmpeg; then
            apt-get -o Acquire::Retries=3 update -qq
            apt-get -o Acquire::Retries=3 install -y -qq --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -1

      - uses: actions/cache@v6
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-e2e-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-e2e-cargo-

      - name: fixtures
        run: bash tests/fixtures/gen.sh

      - name: cargo test (include ignored)
        run: >
          cargo test --locked --no-fail-fast --
          --include-ignored
          --skip analyze::tests::analyze_run_produces_trim_list_with_real_tools

  # 3ツールの版は scripts/build-external-tools.sh の SHA だけで決まる。
  e2e-tools:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    container: rust:1-trixie
    env:
      TACHIKAZE_REQUIRE_TEST_PREREQS: "1"
      TOOLS_PREFIX: /opt/tachikaze-tools
    steps:
      - uses: actions/checkout@v7

      # 3ツールの実行時に libav の共有ライブラリが要るため、キャッシュが当たっても ffmpeg は必ず入れる。
      # ビルド依存は scripts/build-external-tools.sh 冒頭のコメントと同じ。
      - name: ffmpeg and build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get -o Acquire::Retries=3 update -qq
          apt-get -o Acquire::Retries=3 install -y -qq --no-install-recommends \
            ffmpeg build-essential pkg-config git ca-certificates libavformat-dev \
            libavcodec-dev libavutil-dev libswscale-dev libswresample-dev
          ffmpeg -version | head -1

      - name: external tools cache
        id: tools-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.TOOLS_PREFIX }}
          key: ${{ runner.os }}-${{ runner.arch }}-external-tools-${{ hashFiles('scripts/build-external-tools.sh') }}

      - name: build external tools
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-external-tools.sh "$RUNNER_TEMP/tachikaze-tools-build" "$TOOLS_PREFIX"

      - name: add external tools to PATH
        run: echo "$TOOLS_PREFIX/bin" >> "$GITHUB_PATH"

      - uses: actions/cache@v6
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-e2e-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-e2e-cargo-

      - name: fixtures
        run: bash tests/fixtures/gen.sh

      # --skip を付けない。全件を回すのは、テストが3ツールの有る環境でも通ることを検査するため。
      - name: cargo test (include ignored, with external tools)
        run: cargo test --locked --no-fail-fast -- --include-ignored
