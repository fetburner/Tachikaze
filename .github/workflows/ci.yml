name: CI

on:
  push:
    branches: [master]
  pull_request:

# 本 CI は fmt / clippy / 単体テストのみで
# 外部3ツールや ffmpeg も要らないため、1 vCPU の ubuntu-slim で足りる。
# 制約: ジョブ上限 15 分・特権操作不可（Docker-in-Docker 等）。
# コールドビルドが 15 分に近づくようなら ubuntu-latest に戻す。
jobs:
  test:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test
